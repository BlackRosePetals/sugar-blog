<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
    canvas { display: block; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    #content { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .logo-container { display: flex; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 80px; font-weight: bold; }
    .prefix { color: #ffffff; padding-right: 15px; }
    .suffix { color: #000000; background: #ff9900; padding: 5px 20px; border-radius: 15px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <canvas id="aura-canvas"></canvas>
  <div id="content">
    <div class="logo-container" id="logo">
      <span class="prefix" id="prefix">Sugar</span>
      <span class="suffix" id="suffix">Blog</span>
    </div>
  </div>
  <script type="module">
    import { createAuraEngine, EDGE_AURA_PRESETS, EDGE_AURA_PALETTES } from 'https://esm.sh/edge-aura@latest';
    
    const canvas = document.getElementById('aura-canvas');
    const engine = createAuraEngine(canvas, {
      geometry: {
        cornerFill: true,
        inset: 0,
        cornerRadius: 0
      }
    });

    let last = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      engine.step(now - last);
      last = now;
      engine.render();
    }
    requestAnimationFrame(tick);

    window.updateConfig = (config) => {
      if (config.prefixText !== undefined) {
        const p = document.getElementById('prefix');
        p.textContent = config.prefixText;
        p.style.display = config.prefixText ? 'inline' : 'none';
      }
      if (config.suffixText !== undefined) {
        const s = document.getElementById('suffix');
        s.textContent = config.suffixText;
        s.style.display = config.suffixText ? 'inline' : 'none';
      }
      if (config.prefixColor) document.getElementById('prefix').style.color = config.prefixColor;
      if (config.suffixColor) document.getElementById('suffix').style.color = config.suffixColor;
      if (config.suffixBgColor) document.getElementById('suffix').style.backgroundColor = config.suffixBgColor;
      if (config.fontSize) document.getElementById('logo').style.fontSize = config.fontSize + 'px';
      if (config.borderRadius !== undefined) document.getElementById('suffix').style.borderRadius = config.borderRadius + 'px';
      if (config.bgColor) document.body.style.backgroundColor = config.bgColor;
      
      if (config.aura) {
         if (config.aura.palette) {
            engine.setPalette(config.aura.palette, { crossfadeMs: 350 });
         }
         const options = {
            geometry: {
               band: config.aura.band !== undefined ? Number(config.aura.band) : 76,
               innerSigmaMax: config.aura.band !== undefined ? Number(config.aura.band) * (17 / 76) : 17,
               cornerRadius: config.aura.cornerRadius !== undefined ? Number(config.aura.cornerRadius) : 0,
               inset: config.aura.inset !== undefined ? Number(config.aura.inset) : 0,
               cornerFill: true
            },
            palette: {
               ringAlpha: config.aura.ringAlpha !== undefined ? Number(config.aura.ringAlpha) : 0.9,
               pastel: config.aura.pastel !== undefined ? Number(config.aura.pastel) : 0.35,
               normalize: config.aura.preset === 'vivid' ? false : true
            },
            motion: {
               rotateIdleS: config.aura.rotateIdleS !== undefined ? Number(config.aura.rotateIdleS) : 8
            }
         };
         
         // Apply preset base if preset is provided
         if (config.aura.preset && EDGE_AURA_PRESETS[config.aura.preset]) {
            const presetOpts = EDGE_AURA_PRESETS[config.aura.preset];
            // Merge preset with user overrides
            if (presetOpts.geometry) Object.assign(options.geometry, presetOpts.geometry);
            if (presetOpts.palette) Object.assign(options.palette, presetOpts.palette);
            if (presetOpts.motion) Object.assign(options.motion, presetOpts.motion);
            if (presetOpts.input) options.input = presetOpts.input;
            
            // Re-apply explicit overrides
            if (config.aura.band !== undefined) {
               options.geometry.band = Number(config.aura.band);
               options.geometry.innerSigmaMax = Number(config.aura.band) * (17 / 76);
            }
            if (config.aura.cornerRadius !== undefined) options.geometry.cornerRadius = Number(config.aura.cornerRadius);
            if (config.aura.inset !== undefined) options.geometry.inset = Number(config.aura.inset);
            if (config.aura.ringAlpha !== undefined) options.palette.ringAlpha = Number(config.aura.ringAlpha);
            if (config.aura.pastel !== undefined) options.palette.pastel = Number(config.aura.pastel);
            if (config.aura.rotateIdleS !== undefined) options.motion.rotateIdleS = Number(config.aura.rotateIdleS);
         }
         
         engine.updateOptions(options);
      }
      
      if (config.auraEnabled !== undefined) {
         document.getElementById('aura-canvas').style.display = config.auraEnabled ? 'block' : 'none';
      }
    };

    window.exportImage = async () => {
      const canvas = await html2canvas(document.body, {
        backgroundColor: document.body.style.backgroundColor || '#000000',
        scale: 2 // High resolution
      });
      return canvas.toDataURL('image/png');
    };
  </script>
</body>
</html>
